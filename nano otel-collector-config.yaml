receivers:
  otlp:
    protocols:
      http:                       # écoute sur 4318/tcp
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlphttp:
    endpoint: https://automatic-space-fiesta-69jxgp67r6qx25wwr-14318.app.github.dev/  # URL vers Jaeger port 4318
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, logging]
